name: QA regression
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Parallel headless Web regression
        run: sh ./mvnw -B -Pparallel-web -Dbrowser=${{ matrix.browser }} -Dheadless=true clean test
      - name: Generate Allure HTML
        if: always()
        run: sh ./mvnw -B allure:report
      - name: Upload reports and failure screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-${{ matrix.browser }}-reports
          path: |
            target/surefire-reports/
            target/allure-results/
            target/site/allure-maven-plugin/
            test-output/screenshots/
          retention-days: 14
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        group: [api, database]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Start PostgreSQL fixture
        if: matrix.group == 'database'
        run: docker compose -f docker/docker-compose.yml up -d --wait --wait-timeout 120
      - name: Run regression
        run: sh ./mvnw -B -Dgroups=${{ matrix.group }} clean test
      - name: Generate Allure HTML
        if: always()
        run: sh ./mvnw -B allure:report
      - name: Collect PostgreSQL logs
        if: always() && matrix.group == 'database'
        run: docker compose -f docker/docker-compose.yml logs --no-color > postgres.log
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.group }}-reports
          path: |
            target/surefire-reports/
            target/allure-results/
            target/site/allure-maven-plugin/
            postgres.log
          retention-days: 14
      - name: Stop PostgreSQL
        if: always() && matrix.group == 'database'
        run: docker compose -f docker/docker-compose.yml down
